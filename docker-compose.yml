version: '3'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0 #version
    container_name: zookeeper # name displayed in "docker ps" output
    hostname: zookeeper # identify name in internet network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000 # basic time unit in 2 secs
      KAFKA_OPTS: "-Xmx128M -Xms128M" # litmit used RAM
    ports:
      - "2181:2181"
    healthcheck:
      test: ['CMD','bash','-c',"echo 'ruok' | nc localhost 2181"] #send command to check if it ok (ruok: are you ok?)
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - confluent # allows services to communicate with each other

  broker:
    image: confluentinc/cp-server:7.4.0
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - '9091:9091'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092, PLAINTEXT_HOST://localhost:9092 #29092 uses for internal:airflow,..another uses for external
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
#      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema_registry:8081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    networks:
      - confluent
    healthcheck:
      test: [ 'CMD', 'bash', '-c', 'nc -z localhost 9092' ]
      interval: 10s
      timeout: 5s
      retries: 5

