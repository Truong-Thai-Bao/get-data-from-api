  webserver:
#    image: apache/airflow:2.6.0-python3.9
    build: .
    command: airflow webserver
    entrypoint: ['/opt/airflow/script/entry-point.sh']
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR-Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entry-point.sh:/opt/airflow/script/entry-point.sh
#      - ./requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "8080:8080"
    healthcheck:
      test: [ 'CMD-SHELL', "[ -f /opt/airflow/airflow-webserver.pid ]" ]
      interval: 30s
      timeout: 30s
      retries: 10
    networks:
      - confluent

  scheduler:
#    image: apache/airflow:2.6.0-python3.9
    build: .
    depends_on:
      webserver:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entry-point.sh:/opt/airflow/script/entry-point.sh
#      - ./requirements.txt:/opt/airflow/requirements.txt
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
    command: bash -c 'airflow db upgrade && airflow scheduler' #pip install -r ./requirements.txt &&
    networks:
      - confluent

  postgres:
    image: postgres:14.0
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - confluent

  spark-master:
    image: apache/spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
      - ./spark-stream.py:/opt/spark/spark-stream.py
    networks:
      - confluent

