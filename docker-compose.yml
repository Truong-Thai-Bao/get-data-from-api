#      - confluent

  cassandra_db:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
#    restart: always
    ports:
      - '9042:9042'
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - CASSANDRA_USERNAME=cassandra
      - CASSANDRA_PASSWORD=cassandra
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - confluent

networks:
  confluent:

